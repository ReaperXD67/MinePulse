services:
  postgres:
    image: postgres:17-alpine
    container_name: karixmc-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: karixmc
      POSTGRES_USER: karixmc
      POSTGRES_PASSWORD: karixmc-local-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - karixmc_postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karixmc -d karixmc"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    container_name: karixmc-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - karixmc_redis_dev:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  karixmc_postgres_dev:
  karixmc_redis_dev:
